name: Bun Runtime & Web Player CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Bun Test & Build (@foil/runtime + @foil/web-player)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (--ignore-scripts)
        run: bun install --ignore-scripts

      - name: Run @foil/runtime & @foil/web-player unit tests
        run: bun test

      - name: Build @foil/web-player static bundle
        working-directory: web-player
        run: bun run build

      - name: Upload Web Player dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: foil-web-player-dist
          path: web-player/dist
