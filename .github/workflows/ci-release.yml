name: CI & NPM Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run workspace tests
        run: bun test

      - name: Build @foil/web-player
        working-directory: web-player
        run: bun run build

      - name: Upload web-player dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: foil-web-player-dist
          path: web-player/dist

  publish-npm:
    name: Publish to NPM
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish @foil/runtime
        working-directory: runtime
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish

      - name: Publish @foil/web-player
        working-directory: web-player
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish
