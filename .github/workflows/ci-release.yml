name: CI & NPM Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Detect changed packages
        id: changes
        env:
          FORCE_ALL: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run scripts/changed-packages.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run workspace tests
        run: bun test

      - name: Build @foil-engine/runtime
        if: steps.changes.outputs.runtime == 'true' || steps.changes.outputs.web_player == 'true'
        working-directory: runtime
        run: bun run build

      - name: Build @foil-engine/web-player
        if: steps.changes.outputs.web_player == 'true'
        working-directory: web-player
        run: bun run build

      - name: Upload web-player dist artifact
        if: steps.changes.outputs.web_player == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foil-web-player-dist
          path: web-player/dist

  publish-npm:
    name: Publish to NPM
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build @foil-engine/runtime
        working-directory: runtime
        run: bun run build

      - name: Build @foil-engine/web-player
        working-directory: web-player
        run: bun run build

      - name: Publish @foil-engine/runtime
        working-directory: runtime
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish

      - name: Publish @foil-engine/web-player
        working-directory: web-player
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish
